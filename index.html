<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Tyyl Tech PMS</title>
    <meta name="description" content="Premium Multi-Tenant SaaS Hotel Property Management System with robust subscription tracking and audit controls." />
    <meta property="og:title" content="Tyyl Tech PMS" />
    <meta property="og:description" content="Premium Multi-Tenant SaaS Hotel Property Management System with robust subscription tracking and audit controls." />
    <style>
      html, body { background-color: #09090b; color: #f4f4f5; }
      html:not(.dark), html:not(.dark) body { background-color: #eceff4; color: #0f172a; }
    </style>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('pms_theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
        // Defensive suppressor for benign Firestore quota/backoff logs and Vite HMR websocket disconnections
        function isSuppressed(msg) {
          if (!msg) return false;
          var s = typeof msg === 'string' ? msg : '';
          try {
            if (!s && typeof msg === 'object') {
              s = (msg.message ? msg.message + ' ' : '') + (msg.code ? msg.code + ' ' : '') + JSON.stringify(msg);
            }
          } catch(e) { s = String(msg); }
          return (
            s.includes('resource-exhausted') ||
            s.includes('Quota exceeded') ||
            s.includes('Using maximum backoff delay') ||
            s.includes('WebSocket closed without opened') ||
            s.includes('failed to connect to websocket') ||
            s.includes('@firebase/firestore') ||
            s.includes('INTERNAL ASSERTION FAILED') ||
            s.includes('FIRESTORE') ||
            s.includes('Unexpected state') ||
            s.includes('WebChannelConnection') ||
            s.includes("RPC 'Listen' stream") ||
            s.includes('transport errored') ||
            s.includes('vite/client')
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (event) {
            var reason = event.reason || {};
            var msg = reason.message || String(reason) || '';
            if (isSuppressed(msg) || isSuppressed(reason) || reason.code === 'resource-exhausted') {
              event.preventDefault();
              event.stopImmediatePropagation();
              return;
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event) {
            var msg = event.message || '';
            if (isSuppressed(msg) || isSuppressed(event.error)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return;
            }
          }
        }, true);

        var originalError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            if (isSuppressed(args[i])) return;
          }
          originalError.apply(console, arguments);
        };

        var originalWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            if (isSuppressed(args[i])) return;
          }
          originalWarn.apply(console, arguments);
        };

        try {
          var saved = localStorage.getItem('pms_ui_scale');
          if (saved) {
            document.documentElement.style.fontSize = saved + '%';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var root = document.getElementById('root');
        if (!root) return;
        var RELOAD_KEY = 'pms_boot_retry_at';

        function isMounted() {
          return root && root.childElementCount > 0;
        }

        function showRecoveryUI(reason) {
          if (isMounted() || document.getElementById('pms-boot-fallback')) return;
          var panel = document.createElement('div');
          panel.id = 'pms-boot-fallback';
          panel.style.cssText = 'min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,system-ui,sans-serif;text-align:center;';
          panel.innerHTML =
            '<div style="max-width:420px;width:100%;background:#18181b;border:1px solid #27272a;border-radius:16px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,0.5);">' +
              '<h2 style="margin:0 0 8px;font-size:18px;font-weight:700;color:#fafafa;">Unable to load application</h2>' +
              '<p style="margin:0 0 20px;font-size:13px;line-height:1.5;color:#a1a1aa;">' +
                (reason || 'A network or script loading interruption prevented the interface from starting.') +
              '</p>' +
              '<button type="button" id="pms-boot-reload-btn" style="width:100%;padding:11px 16px;border:0;border-radius:10px;background:#10b981;color:#052e16;font-weight:700;font-size:14px;cursor:pointer;">Reload Application</button>' +
            '</div>';
          root.appendChild(panel);
          var btn = document.getElementById('pms-boot-reload-btn');
          if (btn) {
            btn.addEventListener('click', function() {
              try { sessionStorage.removeItem(RELOAD_KEY); } catch (e) {}
              window.location.reload();
            });
          }
        }

        function attemptSafeRecovery(reason) {
          if (isMounted()) return;
          try {
            var last = Number(sessionStorage.getItem(RELOAD_KEY) || '0');
            var now = Date.now();
            if (!last || now - last > 30000) {
              sessionStorage.setItem(RELOAD_KEY, String(now));
              window.location.reload();
              return;
            }
          } catch (e) {}
          showRecoveryUI(reason);
        }

        window.addEventListener('error', function(e) {
          if (isMounted()) return;
          var target = e && e.target;
          if (target && target.tagName === 'SCRIPT') {
            attemptSafeRecovery('Failed to load application scripts from the server. Please reload to retry.');
          }
        }, true);

        window.addEventListener('vite:preloadError', function() {
          attemptSafeRecovery('A newer version of the application was deployed. Reloading...');
        });

        setTimeout(function() {
          if (!isMounted()) {
            showRecoveryUI('The application is taking longer than expected to initialize. Please reload.');
          }
        }, 15000);
      })();
    </script>
  </body>
</html>
