<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Tyyl Tech PMS</title>
    <meta name="description" content="Premium Multi-Tenant SaaS Hotel Property Management System with robust subscription tracking and audit controls." />
    <meta property="og:title" content="Tyyl Tech PMS" />
    <meta property="og:description" content="Premium Multi-Tenant SaaS Hotel Property Management System with robust subscription tracking and audit controls." />
    <script>
      (function() {
        // Suppress benign Vite HMR websocket disconnection unhandled rejections
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var msg = event.reason.message || String(event.reason) || '';
            if (msg.includes('WebSocket') || msg.includes('websocket')) {
              event.preventDefault();
            }
          }
        });
        // Filter benign WebChannel transport reconnection warnings
        var originalWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(arg) {
            try {
              return typeof arg === 'string' ? arg : JSON.stringify(arg);
            } catch (e) {
              return String(arg);
            }
          }).join(' ');
          if (joined.includes('WebChannelConnection') || joined.includes('RPC \'Listen\' stream') || joined.includes('transport errored')) {
            return;
          }
          originalWarn.apply(console, arguments);
        };
        try {
          var saved = localStorage.getItem('pms_ui_scale');
          if (saved) {
            document.documentElement.style.fontSize = saved + '%';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
